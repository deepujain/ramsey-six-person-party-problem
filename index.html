<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="At a party, how many people guarantee three who all know each other or three who are all strangers? A single-page visual explanation of why the answer is six.">
<title>The six-person party problem</title>
<style>
:root{color-scheme:light;--paper:#fafbf9;--ink:#253a39;--muted:#617370;--friend:#4286a5;--stranger:#bf754d;--line:#dfe6df;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}main{max-width:1180px;margin:0 auto;padding:30px 32px 22px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;margin:0 0 12px;color:var(--muted)}header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 44px;align-items:center}h1{font-size:clamp(24px,3.2vw,40px);font-weight:500;letter-spacing:-1.2px;line-height:1.12;margin:0 0 13px;max-width:820px}.question p{max-width:790px;margin:0;font-size:16px;line-height:1.5;color:var(--muted)}.question strong{color:var(--ink);font-weight:500}.answer{margin:0;text-align:center;font-size:13px;color:var(--muted)}.answer strong{display:block;font-size:86px;letter-spacing:-5px;line-height:1.05;font-weight:400;color:var(--ink)}.legend{display:flex;justify-content:center;gap:12px 28px;flex-wrap:wrap;font-size:13px;margin:24px 0 12px;color:var(--muted)}.key{display:inline-block;width:25px;vertical-align:middle;border-top:2px solid var(--friend);margin-right:7px}.key.stranger{border-top:2px dashed var(--stranger)}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}figure{margin:0;min-width:0}figure+figure{border-left:1px solid var(--line);padding-left:48px}.label{display:flex;gap:12px;justify-content:space-between;align-items:baseline;margin:8px 0 0}h2{font-size:21px;font-weight:500;letter-spacing:-.5px;margin:0}.verdict{color:var(--muted);font-size:13px}svg{display:block;width:100%;height:clamp(190px,calc(100svh - 370px),420px)}svg text{fill:var(--ink);font-size:14px;font-weight:500}figcaption{font-size:15px;line-height:1.45;color:var(--muted);margin-top:7px;max-width:470px}figcaption strong{font-weight:500;color:var(--ink)}footer{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:25px;padding-top:15px;border-top:1px solid var(--line);font-size:13px}a{color:var(--ink);text-decoration-color:#a7b7ae;text-underline-offset:4px}a:hover{text-decoration-color:var(--ink)}a:focus-visible{outline:2px solid var(--friend);outline-offset:4px}
@media(max-width:700px){main{padding:20px 18px 16px}header{gap:14px}.eyebrow{font-size:10px;margin-bottom:9px}h1{font-size:26px;letter-spacing:-.7px;margin-bottom:10px}.question p{font-size:14px}.answer strong{font-size:60px;letter-spacing:-3px}.answer{font-size:11px}.legend{font-size:12px;margin:18px 0 10px;gap:10px 16px}.comparison{gap:16px}figure+figure{padding-left:16px}.label{display:block}h2{font-size:17px;letter-spacing:-.4px}.verdict{font-size:11px;display:block;margin-top:2px}svg{height:clamp(150px,27svh,210px)}svg text{font-size:12px}figcaption{font-size:12px;margin-top:6px}footer{margin-top:18px;padding-top:12px;font-size:12px;gap:16px}}
@media(max-width:420px){main{padding:15px 14px 12px}header{display:block}h1{font-size:24px;line-height:1.1}.answer{display:flex;align-items:center;gap:6px;text-align:left;margin-top:11px;font-size:13px}.answer strong{display:inline;font-size:25px;letter-spacing:-1px;order:2}.answer span:after{content:':'}.legend{justify-content:flex-start;margin:14px 0 8px;font-size:11px;gap:8px 15px}.comparison{gap:12px}figure+figure{padding-left:12px}h2{font-size:16px}.verdict{font-size:11px}figcaption{font-size:12px}footer{margin-top:16px}}
@media(max-height:500px) and (min-width:701px){main{padding-top:12px;padding-bottom:10px}.eyebrow{margin-bottom:5px}h1{font-size:26px;margin-bottom:6px}.question p{font-size:13px}.answer strong{font-size:50px}.legend{margin:10px 0 2px}svg{height:150px}.comparison{gap:28px}figure+figure{padding-left:28px}h2{font-size:18px}figcaption{font-size:13px}footer{margin-top:12px;padding-top:9px}}
</style>
</head>
<body>
<main>
  <p class="eyebrow">The party problem · Ramsey theory</p>
  <header>
    <div class="question"><h1>How many people make this certain?</h1><p>At a party, find <strong>three who all know each other</strong>, or <strong>three who are all strangers to each other</strong>. How many guests guarantee one of these groups?</p></div>
    <p class="answer"><span>The answer</span><strong>6</strong></p>
  </header>
  <div class="legend"><span><i class="key" aria-hidden="true"></i>Know each other</span><span><i class="key stranger" aria-hidden="true"></i>Strangers</span></div>
  <section class="comparison" aria-label="Five people can fail; six people always guarantee a group">
    <figure id="five"><div class="label"><h2>Five people</h2><span class="verdict">Can fail</span></div><svg role="img" aria-labelledby="five-title five-desc"></svg><figcaption>No trio has three solid or three dashed lines.</figcaption></figure>
    <figure id="six"><div class="label"><h2>Six people</h2><span class="verdict">Always enough</span></div><svg role="img" aria-labelledby="six-title six-desc"></svg><figcaption><strong>Amy, Cara, and Fay</strong> are all strangers.</figcaption></figure>
  </section>
  <footer><a href="https://github.com/deepujain/ramsey-six-person-party-problem/blob/main/PROOF.md">Why six always works</a><a href="https://github.com/deepujain/ramsey-six-person-party-problem">Code and verification</a></footer>
</main>
<script>
(() => {
  const names=['Amy','Ben','Cara','Dan','Eli','Fay'];
  const ns='http://www.w3.org/2000/svg';
  function add(parent,tag,attrs={},text){const el=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));if(text!==undefined)el.textContent=text;parent.append(el);return el}
  function paint(n){
    const id=n===5?'five':'six',svg=document.querySelector(`#${id} svg`);
    const {width:w,height:h}=svg.getBoundingClientRect();
    if(!w||!h)return;
    const r=w<220?18:26,rx=w/2-r-8,ry=h/2-r-8;
    const points=names.slice(0,n).map((_,i)=>{const a=-Math.PI/2+2*Math.PI*i/n;return[w/2+rx*Math.cos(a),h/2+ry*Math.sin(a)]});
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.replaceChildren();
    add(svg,'title',{id:id+'-title'},n===5?'Five people with no group of three mutual acquaintances or three mutual strangers':'Six people, highlighting three mutual strangers: Amy, Cara, and Fay');
    add(svg,'desc',{id:id+'-desc'},n===5?'The solid lines form a five-cycle, and the dashed lines form another five-cycle. Neither contains a triangle.':'Amy, Cara, and Fay are connected by three dashed lines. Every pair in that group are strangers. The other relationships are shown faintly.');
    const chosen=[0,2,5];
    if(n===6)add(svg,'polygon',{points:chosen.map(i=>points[i].join(',')).join(' '),fill:'var(--stranger)','fill-opacity':'.10'});
    for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){
      const known=a<5&&b<5&&(b-a===1||b-a===4),hot=n===6&&chosen.includes(a)&&chosen.includes(b);
      add(svg,'line',{x1:points[a][0],y1:points[a][1],x2:points[b][0],y2:points[b][1],stroke:known?'var(--friend)':'var(--stranger)','stroke-width':hot?3:1.6,'stroke-dasharray':known?'none':'5 4',opacity:n===6&&!hot?.16:.85,'data-pair':`${a}-${b}`,'data-known':known?'1':'0','data-highlighted':hot?'true':'false'});
    }
    points.forEach(([x,y],i)=>{add(svg,'circle',{cx:x,cy:y,r,fill:'var(--paper)',stroke:'var(--line)','stroke-width':1});add(svg,'text',{x,y:y+4,'text-anchor':'middle'},names[i])});
  }
  const redraw=()=>{paint(5);paint(6)};
  new ResizeObserver(redraw).observe(document.querySelector('.comparison'));
  redraw();
})();
</script>
</body>
</html>
